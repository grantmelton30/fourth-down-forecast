name: track-rules
# Forward tracking for BOTH pre-registered rules:
#   ncaa-model/PREREG.md P1 -- totals, restricted universe, model-market gap 0.5-6.0
#   nfl-model/PREREG.md  W1 -- totals, outdoor, forecast wind >= 10 mph, UNDER only
#
# W1 only means anything if the bet is written down BEFORE kickoff, at the forecast and the
# number available then. A rule nobody logs produces no record, and a record assembled in
# December is not evidence. This runs the log so no human has to remember to.
#
# NOT AN AUTHORISATION TO BET. `bets_allowed()` is False and six gates fail. This records
# what the declared rule would have done.
on:
  workflow_dispatch:
  schedule:
    # DAILY in season, paired with track_w1.MAX_HOURS_BEFORE_KICKOFF = 48h. The window, not
    # the calendar, decides what records: a game is logged on the first daily pass that finds
    # it inside 48 hours of its own kickoff, so every game gets a similar short horizon
    # instead of whatever a fixed weekday happened to give it.
    #
    # A fixed Thursday gave Thursday-night games ~9h and Monday-night games ~4 days. Forecast
    # error grows with horizon and the edge shrinks with it -- roughly two points of win rate
    # between a 1-day and a 4-day forecast -- so the uneven version was leaving measurable
    # edge on the table.
    #
    # Daily also means a failed run is recoverable: with a 48h window most games get two
    # chances, so one red X does not automatically cost that week's bets.
    #
    # 13:00 UTC is ~09:00 ET, before any kickoff on any day of the week.
    - cron: "0 13 * 8-12,1,2 *"
permissions:
  contents: write
concurrency:
  # Separate from `publish-ledger` so a 3-hour model rebuild cannot delay a bet-time
  # forecast past the games it is meant to price. Both push to main; the rebase below is
  # what makes that safe, exactly as publish.yml does for its own overlapping schedules.
  group: track-rules
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen --dev

      # The log is append-only and committed. Writing to it from a build whose own tests
      # fail would put an unfixable bad row into a permanent record, so this gates it.
      - name: Verify tracking and grading before writes
        id: verify
        run: |
          uv run pytest -q shared/tests/test_tracked_rules.py shared/tests/test_build_tracker.py shared/tests/test_grade_all_games.py shared/tests/test_execution_quotes.py
          (cd nfl-model && uv run pytest -q tests/test_track_w1.py)
          (cd ncaa-model && uv run pytest -q tests/test_track_p1.py)

      # NFL_MODEL_CACHE_DIR is deliberately NOT set: the default repo-local cache is what
      # the Actions cache below restores. `track_w1.py` anchors its log to the repo rather
      # than the cache dir, so the log location does not depend on this either way.
      - name: Restore source caches
        uses: actions/cache/restore@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
            ncaa-model/data/api_budget.json
          key: track-rules-${{ runner.os }}-${{ github.run_id }}
          restore-keys: track-rules-${{ runner.os }}-

      # Grade first, then record. Both are idempotent and append-only -- `grade` settles
      # only finished games, `record` refuses to rewrite a game already logged -- so running
      # both on every trigger is safe and removes any need to branch on which cron fired.
      # It also means a missed run self-heals on the next one, for games still ungraded.
      - name: Grade finished bets
        run: cd nfl-model && uv run python track_w1.py grade

      # Never `continue-on-error`. A silent failure here loses a bet-time forecast that
      # cannot be reconstructed afterwards -- the whole point of the exercise -- so a broken
      # run must be a red X in the Actions tab, not a quiet no-op.
      - name: Record games kicking off within 48h
        run: cd nfl-model && uv run python track_w1.py record

      # NCAA P1. Separate rule, separate log, same discipline. It has no recording window
      # of its own -- unlike W1 the open/close price difference was measured and is inside
      # noise (p = 0.137), so there is nothing for a window to buy.
      - name: Grade finished P1 bets
        run: cd ncaa-model && uv run python track_p1.py grade

      - name: Record this week's P1 bets
        run: cd ncaa-model && uv run python track_p1.py record

      - name: Print the running records
        run: |
          (cd nfl-model && uv run python track_w1.py report)
          (cd ncaa-model && uv run python track_p1.py report)

      # FULL-SLATE GRADE + CLV. Research instrument, deliberately NOT on the site: it writes
      # to data/internal/, which build_static_site.py does not copy into dist/. The bet logs
      # settle ~5 games a week; the projection ledger has an opinion on 40-90, and the
      # discarded nine-tenths is the only part large enough to say anything within a season.
      #
      # Fail visibly on grading errors; preserve successful rows in the final commit.
      - name: Grade the full slate and report CLV
        run: uv run python scripts/grade_all_games.py --quiet

      # Publishes both logs to web/api/v1/tracker.json for the site's Record tab. Reads the
      # logs and never recomputes them -- re-deriving what "would have" qualified from
      # today's model would replace the bet-time number and turn the record into a backtest.
      - name: Publish the forward record to the site
        if: always() && steps.verify.outcome == 'success'
        run: uv run python scripts/build_tracker.py

      - name: Validate generated tracking artifacts
        if: always() && steps.verify.outcome == 'success'
        run: uv run python scripts/validate_tracking_artifacts.py

      - name: Save refreshed caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
            ncaa-model/data/api_budget.json
          key: track-rules-${{ runner.os }}-${{ github.run_id }}

      - name: Commit the log
        if: always() && steps.verify.outcome == 'success'
        run: |
          # Stage each path SEPARATELY and only if it exists. `git add a b c` aborts
          # atomically when any one pathspec matches nothing, so listing a log that has not
          # been created yet silently stages NOTHING -- which is exactly what happened on
          # 2026-08-21: 26 P1 bets were recorded, w1_log.csv did not exist yet, and the step
          # reported success having committed nothing.
          staged=0
          for f in nfl-model/data/w1_log.csv ncaa-model/data/p1_log.csv                    web/api/v1/tracker.json data/internal/graded_games_v2.csv data/internal/grading_status.json; do
            if [ -f "$f" ]; then git add -- "$f"; staged=1; fi
          done
          if [ "$staged" = "0" ] || git diff --cached --quiet; then
            echo "no change to either log"; exit 0
          fi
          git config user.name "fourth-down-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "track: record and grade the pre-registered rules (P1, W1)"
          # publish-ledger pushes to main on its own schedule; rebase onto whatever it
          # landed rather than clobbering it.
          git pull --rebase --autostash origin main
          git push
      - name: Preserve tracking evidence for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-evidence-${{ github.run_id }}
          path: |
            nfl-model/data/w1_log.csv
            ncaa-model/data/p1_log.csv
            data/internal
          if-no-files-found: ignore
