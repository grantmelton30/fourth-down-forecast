name: publish-ledger
on:
  workflow_dispatch:
  schedule:
    # Tuesday after the weekend is graded; Friday catches late lines/injury context.
    - cron: "17 11 * * 2,5"
    # Lightweight market-only republish: no model rebuild (skips both run_backtest.py
    # calls), just fresh live-season games/lines and a republish. Bumped from once daily
    # to every 4 hours 2026-08-18 -- the displayed market number was going stale for up to
    # 24h even though quotes were already being archived every 6h below.
    - cron: "17 */4 * * *"
    # Market capture only. Timestamped quotes cannot be reconstructed later, so this
    # runs far more often than any model work and spends ~1 API call per pass.
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency:
  group: scheduled-model-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen --dev
      - name: Restore source and model caches
        uses: actions/cache/restore@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
            ncaa-model/data/api_budget.json
          key: football-model-${{ runner.os }}-${{ github.run_id }}
          restore-keys: football-model-${{ runner.os }}-
      - name: Verify shared, NFL, and NCAA suites in isolated processes
        run: |
          uv run pytest -q shared/tests
          (cd nfl-model && uv run pytest -q -m "not integration" tests)
          (cd ncaa-model && uv run pytest -q -m "not integration" tests)
      # Runs on every schedule, including the frequent capture-only pass. A quote that
      # is not recorded now cannot be recovered later, so this must not depend on the
      # model rebuild below succeeding.
      - name: Capture market quotes
        run: uv run python scripts/collect_market_quotes.py
      - name: Refresh sources, rebuild models, and stage publication
        if: github.event.schedule != '23 */6 * * *'
        run: |
          if [ "${{ github.event.schedule }}" = "17 */4 * * *" ]; then
            uv run python scripts/refresh_publication.py --market-only
          else
            uv run python scripts/refresh_publication.py
          fi
      - name: Validate promoted publication
        if: github.event.schedule != '23 */6 * * *'
        run: uv run python scripts/validate_publication.py
      - name: Save refreshed caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
            ncaa-model/data/api_budget.json
          key: football-model-${{ runner.os }}-${{ github.run_id }}
      - name: Commit changed static artifact
        run: |
          TRACKED="data/predictions.jsonl data/evidence data/market_quotes.jsonl web/api/v1"
          if git diff --quiet -- $TRACKED; then exit 0; fi
          git config user.name "fourth-down-bot"
          git config user.email "actions@users.noreply.github.com"
          # The evidence goes in the same commit as the claim it authorized.
          git add data/predictions.jsonl data/evidence data/market_quotes.jsonl \
            web/api/v1/predictions.json web/api/v1/explorer.json
          # Concurrent schedules append to the same ledgers; rebase onto whatever the
          # previous run pushed rather than clobbering it.
          git commit -m "capture market quotes and refresh projections"
          # RETRY, because a rebase can still fail on files the union driver does not cover.
          # .gitattributes resolves the append-only ledgers automatically, but the
          # regenerated artifacts (web/api/v1/*.json, data/evidence) are whole documents and
          # a concurrent run rewrites them wholesale. For those, "whatever the other run
          # produced, then re-apply mine" is the correct resolution -- they are derived files
          # and the next run regenerates them anyway. Failing the whole job over them lost
          # the market capture too, which is the one thing that cannot be re-created.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push && exit 0
            fi
            echo "rebase failed (attempt $attempt); resolving derived artifacts and retrying"
            git checkout --theirs -- web/api/v1 data/evidence 2>/dev/null || true
            git add -A
            GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            sleep 5
          done
          echo "could not land the commit after 3 attempts"; exit 1
