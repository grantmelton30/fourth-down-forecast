name: publish-ledger
on:
  workflow_dispatch:
  schedule:
    # Tuesday after the weekend is graded; Friday catches late lines/injury context.
    - cron: "17 11 * * 2,5"
    # Lightweight market-only republish: no model rebuild (skips both run_backtest.py
    # calls), just fresh live-season games/lines and a republish. Two-hour opportunities
    # give GitHub's delayed scheduler multiple chances to land inside each strict six-hour
    # grading window; the August 28-30 gaps showed that four-hour scheduling was not enough.
    - cron: "17 */2 * * *"
    # Market capture only. Timestamped quotes cannot be reconstructed later, so this
    # runs far more often than any model work and spends ~1 API call per pass.
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency:
  group: scheduled-model-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen --dev
      - name: Restore source and model caches
        uses: actions/cache/restore@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
          key: football-model-${{ runner.os }}-${{ github.run_id }}
          restore-keys: football-model-${{ runner.os }}-
      - name: Restore CFBD budget counter
        uses: actions/cache/restore@v6
        with:
          path: ncaa-model/data/api_budget.json
          key: cfbd-budget-${{ runner.os }}-${{ github.run_id }}
          restore-keys: cfbd-budget-${{ runner.os }}-
      - name: Verify shared, NFL, NCAA, and prop suites in isolated processes
        run: |
          uv run pytest -q shared/tests
          (cd nfl-model && uv run pytest -q -m "not integration" tests)
          (cd ncaa-model && uv run pytest -q -m "not integration" tests)
          (cd prop-model && uv run pytest -q tests)
      # Runs on every schedule, including the frequent capture-only pass. A quote that
      # is not recorded now cannot be recovered later, so this must not depend on the
      # model rebuild below succeeding.
      - name: Capture market quotes
        id: capture
        run: uv run python scripts/collect_market_quotes.py
      - name: Refresh sources, rebuild models, and stage publication
        if: github.event.schedule != '23 */6 * * *'
        run: |
          if [ "${{ github.event.schedule }}" = "17 */2 * * *" ]; then
            uv run python scripts/refresh_publication.py --market-only
          else
            uv run python scripts/refresh_publication.py
          fi
      - name: Validate promoted publication
        id: validate
        if: github.event.schedule != '23 */6 * * *'
        run: uv run python scripts/validate_publication.py
      - name: Save successful source and model caches
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            nfl-model/data/cache
            ncaa-model/data/cache
          key: football-model-${{ runner.os }}-${{ github.run_id }}
      - name: Save CFBD budget counter
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ncaa-model/data/api_budget.json
          key: cfbd-budget-${{ runner.os }}-${{ github.run_id }}
      - name: Commit changed static artifact
        if: always() && steps.capture.outcome == 'success'
        env:
          PUBLICATION_VALID: ${{ steps.validate.outcome == 'success' }}
        run: |
          TRACKED="data/predictions.jsonl data/evidence data/market_quotes.jsonl data/internal/ncaa_totals_shadow.jsonl web/api/v1"
          if git diff --quiet -- $TRACKED; then exit 0; fi
          git config user.name "fourth-down-bot"
          git config user.email "actions@users.noreply.github.com"
          # The evidence goes in the same commit as the claim it authorized.
          git add data/market_quotes.jsonl
          if [ "$PUBLICATION_VALID" = "true" ]; then
            git add data/predictions.jsonl data/evidence web/api/v1/predictions.json web/api/v1/explorer.json
            if [ -f data/internal/ncaa_totals_shadow.jsonl ]; then
              git add data/internal/ncaa_totals_shadow.jsonl
            fi
          fi
          if git diff --cached --quiet; then exit 0; fi
          # Concurrent schedules append to the same ledgers; rebase onto whatever the
          # previous run pushed rather than clobbering it.
          git commit -m "capture market quotes and refresh projections"
          # A conflict needs review; never auto-stage unvalidated local artifacts.
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "could not land the commit after 3 attempts"; exit 1
      - name: Preserve captured evidence for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-evidence-${{ github.run_id }}
          path: |
            data/market_quotes.jsonl
            data/internal/ncaa_totals_shadow.jsonl
          if-no-files-found: ignore
