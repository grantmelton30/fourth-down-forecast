name: integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run python run_tests.py
      - run: uv run python scripts/publish_ledger.py
      - name: Ensure publication is reproducible
        run: git diff --exit-code -- web/api/v1/predictions.json
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m http.server 8765 --directory web >/tmp/web.log 2>&1 &
      - run: curl --fail --retry 5 http://127.0.0.1:8765/ >/dev/null
      - run: curl --fail http://127.0.0.1:8765/api/v1/predictions.json | python3 -m json.tool >/dev/null
